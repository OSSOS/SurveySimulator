[build-system]
# Python>=3.12 / NumPy>=2: f2py-f90wrap compiles via meson+ninja (not distutils).
requires = [
    "setuptools>=68",
    "wheel",
    "numpy>=2",
    "f90wrap",
    "meson",
    "ninja",
    "setuptools-scm>=8",
]
build-backend = "setuptools.build_meta"

[project]
name = "OSSSurveySimulator"
dynamic = ["version"]
description = "Outer Solar System Survey Simulation written in F95 with Python bindings."
readme = "README.md"
authors = [
    {name = "J.M. Petit", email = "jmpetit@obs-besacon.fr" },
    {name = "J.J. Kavelaars", email = "jjkavelaars@gmail.com" }
]
license = "EUPL-1.2"
license-files = ["LICENCE.txt"]
dependencies = [
    "astropy>=7.0",
    "numpy>=2.3",
    "matplotlib",
    "pydantic",
    "scipy",
    "rebound",
    "astroquery",
    # f90wrap-generated ossssimlib imports f90wrap.runtime at import time
    "f90wrap",
]
requires-python = ">=3.12"
keywords = [
   "astronomy",
   "planetary",
   "solar system",
   "surveys",
   "telescope",
]

[project.urls]
homepage = "https://www.ossos-survey.org/simulator.html"

# Extension is built by setup.py (make -C F95 MODULE=ossssimlib → _ossssimlib + ossssimlib/).
# ossssimlib is the f90wrap-generated pure-python package (created by make into
# F95/ossssimlib); _ossssimlib is the compiled f2py module it wraps.
# Legacy name SurveySubsF95 / _SurveySubsF95.so is no longer used.
[tool.setuptools]
packages = ["ossssim", "ossssimlib"]
package-dir = {"" = "src", "ossssimlib" = "F95/ossssimlib"}
include-package-data = true
ext-modules = [
  {name = "_ossssimlib", sources = []}
]

[tool.setuptools_scm]
version_file = "src/ossssim/__version__.py"
fallback_version = "2.0.0"

# Ignore legacy non-PEP440 tags such as SurveySim11 / FirstQuarterPaper.
# Prefer dotted tags (v2.0.0, 2025.2, …).
[tool.setuptools_scm.tag]
strict = true
