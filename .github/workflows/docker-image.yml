name: Publish to CANFAR

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        # Full history + tags so setuptools_scm can derive the image version.
        fetch-depth: 0

    # astroml-based images are multi-GB; default runners often OOM or fill the disk
    # while BuildKit exports layers (exit 143). Free unused preinstalled toolchains first.
    - name: Free disk space
      run: |
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/hostedtoolcache
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        docker system prune -af
        df -h

    # Extra headroom so layer export does not compete with compile/link RAM.
    - name: Add swap space
      run: |
        sudo fallocate -l 8G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        free -h

    - name: Install setuptools-scm (for the image tag)
      run: python -m pip install --upgrade setuptools-scm

    - name: Log in to CANFAR Harbor
      if: github.event_name == 'push'
      uses: docker/login-action@v3
      with:
        registry: images.canfar.net
        username: ${{ secrets.IMAGES_CANFAR_LOGIN }}
        password: ${{ secrets.IMAGES_CANFAR_TOKEN }}

    - name: Set up low-parallelism BuildKit builder
      run: |
        cat > /tmp/buildkitd.toml <<'EOF'
        [worker.oci]
          max-parallelism = 2
        EOF
        docker buildx rm ssimbuilder 2>/dev/null || true
        docker buildx create --name ssimbuilder --driver docker-container \
          --config /tmp/buildkitd.toml --use
        docker buildx inspect --bootstrap

    - name: Build the unified SSim image
      env:
        DOCKER_BUILDKIT: "1"
        MAKEFLAGS: "-j2"
        CMAKE_BUILD_PARALLEL_LEVEL: "2"
      run: make build

    - name: Push to CANFAR
      if: github.event_name == 'push'
      run: make push
